name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "pandas>=2.0" "numpy>=1.24" "scikit-learn>=1.3"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Data audit on the synthetic sample
        run: python scripts/data_audit.py --data data/sample/cafes_sample.csv --out /tmp/data_audit.md
