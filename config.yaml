# Default settings (the app also lets you change alpha and top_n)
hybrid:
  alpha: 0.7        # weight on content similarity; (1 - alpha) goes to the cafe's rating
  top_n: 5

content:
  max_features: 5000

data:
  processed: data/processed/cafecritic_processed.csv
  sample: data/sample/cafes_sample.csv
